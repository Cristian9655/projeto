spring.application.name=projeto

# Desativa Docker Compose automático
spring.docker.compose.enabled=false

# Conexão dinâmica: usa H2 localmente/CI e Azure SQL na nuvem via variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:zeladoria;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Console H2 (ativo apenas localmente)
spring.h2.console.enabled=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
