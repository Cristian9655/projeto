
spring.application.name=projeto

# Desativa Docker Compose automatico
spring.docker.compose.enabled=false

# H2 localmente/CI e Azure SQL na nuvem
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:zeladoria;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# O Spring Boot identifica automaticamente o driver JDBC

# Console H2
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Porta da aplicacao
server.port=${PORT:8080}
